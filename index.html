<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>RelayPulse · 正在连接实时主节点...</title>
  <style>
    body { background:#090b10; color:#f1f5f9; font-family:-apple-system,BlinkMacSystemFont,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { text-align:center; padding:32px; background:#11151f; border:1px solid rgba(255,255,255,0.1); border-radius:12px; max-width:460px; }
    .btn { display:inline-block; margin-top:14px; padding:8px 16px; background:#d97757; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; font-size:13px; }
    .sub { font-size:12px; color:#8b9bb4; margin-top:8px; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:22px;font-weight:700;margin-bottom:8px;">⚡ RelayPulse</div>
    <div id="statusText" style="font-size:13.5px;color:#cbd5e1;">正在实时获取最新加密隧道地址并自动跳转...</div>
    <div class="sub">本机访问可直接点击: <a href="http://localhost:4399" style="color:#34d399;">http://localhost:4399</a> · 局域网: <a href="http://192.168.50.13:4399" style="color:#60a5fa;">http://192.168.50.13:4399</a></div>
    <a id="directBtn" class="btn" href="https://a2b3ead629eedd.lhr.life">🚀 立即进入公网节点</a>
  </div>
  <script>
    (async function() {
      const fallbackUrl = "https://a2b3ead629eedd.lhr.life";
      try {
        // Fetch live un-cached endpoint via GitHub API first (0-second CDN delay!)
        const apiRes = await fetch("https://api.github.com/repos/pandarey0130-lab/relaypulse-portal/contents/endpoint.json?t=" + Date.now(), {
          cache: "no-store",
          headers: { "Accept": "application/vnd.github.v3.raw" }
        });
        if (apiRes.ok) {
          const data = await apiRes.json();
          if (data && data.url) {
            document.getElementById("directBtn").href = data.url;
            window.location.replace(data.url);
            return;
          }
        }
      } catch (e) {}
      try {
        const rawRes = await fetch("./endpoint.json?t=" + Date.now(), { cache: "no-store" });
        if (rawRes.ok) {
          const data = await rawRes.json();
          if (data && data.url) {
            document.getElementById("directBtn").href = data.url;
            window.location.replace(data.url);
            return;
          }
        }
      } catch (e) {}
      window.location.replace(fallbackUrl);
    })();
  </script>
</body>
</html>
